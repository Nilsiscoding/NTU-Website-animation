<script>
	var vTag;
	var isShowing = 0;

];

function play1() { 
    var frame = document.getElementById("youtube-frame");
     frame.innerHTML = `
        <video id="video" width="560" height="315" autoplay>
            <source src="Videos/Hindgut.mp4" type="video/mp4">

 document.getElementById("startUI").style.display = "none";
//document.getElementById("dropdownUI").style.display = "none";


vTag = document.getElementById('video');
vTag.play();


vTag.ontimeupdate = function () {
        var cTime = vTag.currentTime;

        pausePoints.forEach(function (point, index) {

            if (
                cTime >= point &&
                !triggeredPoints.includes(index)
            ) {
                vTag.pause();
                isPause = 1;
				currentStop = index;
                triggeredPoints.push(index);
				console.log(triggeredPoints+" "+currentStop);

                toggleButton();
            }
        });
		
	}
	vTag.onended = function() {
			finishedVideo();
		};
}
